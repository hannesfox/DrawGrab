[package]
name = "drawgrab"
version = "1.0.0"
edition = "2021"
description = "Liest Schriftfelder (Zeichnungsnummer, Bezeichnung, Material, Oberflaechenbehandlung) aus technischen Zeichnungen (PDF) und exportiert sie als Excel."

[[bin]]
name = "drawgrab"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
pdfium-render = "0.9.5"
rust_xlsxwriter = "0.104"
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = 2
